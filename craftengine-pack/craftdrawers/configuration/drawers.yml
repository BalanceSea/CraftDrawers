blocks:
  craftdrawers:drawer_oak_full_1:
    settings:
      item: craftdrawers:drawer_oak_full_1
      hardness: 2.0
      resistance: 3.0
      is-suffocating: true
      is-redstone-conductor: true
      push-reaction: block
      instrument: bass
      tags: ["minecraft:mineable/axe"]
      sounds:
        break: minecraft:block.wood.break
        fall: minecraft:block.wood.fall
        hit: minecraft:block.wood.hit
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
    state:
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        north:
          auto-state: note_block
          model: minecraft:block/craftdrawers/oak_drawer_1
        east:
          auto-state: note_block
          model:
            path: minecraft:block/craftdrawers/oak_drawer_1
            y: 90
        south:
          auto-state: note_block
          model:
            path: minecraft:block/craftdrawers/oak_drawer_1
            y: 180
        west:
          auto-state: note_block
          model:
            path: minecraft:block/craftdrawers/oak_drawer_1
            y: 270
      variants:
        facing=north: {appearance: north}
        facing=east: {appearance: east}
        facing=south: {appearance: south}
        facing=west: {appearance: west}
